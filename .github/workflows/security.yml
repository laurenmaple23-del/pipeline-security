name: security

on:
  push:
  pull_request:          # NOT pull_request_target: fork PRs get no secrets and a read-only token

# Least privilege: the token can read the repo and nothing else.
permissions:
  contents: read

jobs:
  # GATE: a committed secret is compromised the moment it is pushed, so this must block.
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA. Verify with:
      #   git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0            # Gitleaks scans full history, not just the latest commit
          persist-credentials: false # don't leave the token in .git/config for later steps
      - name: Run Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --exit-code 1 --verbose --redact

  # GATE: fast, runs on our own code only, and command injection is cheap to fix now.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.90.0 \
            semgrep scan --config auto --error /src

  # REPORT: results depend on an outside CVE database that changes daily,
  # so it surfaces findings without blocking every unrelated change.
  dependency-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Trivy
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            aquasec/trivy:0.56.2 \
            fs --scanners vuln --exit-code 0 /repo
