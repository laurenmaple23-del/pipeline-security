name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # GATE
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --exit-code 1 --verbose --redact

  # GATE
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.90.0 \
            semgrep scan --config auto --error /src

  # REPORT
  dependency-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Trivy
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            aquasec/trivy:0.56.2 \
            fs --scanners vuln --exit-code 0 /repo
